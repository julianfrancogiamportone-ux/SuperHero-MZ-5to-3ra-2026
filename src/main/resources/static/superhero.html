<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pelea Épica: Superheroes vs Villanos</title>
<link rel="stylesheet" href="css/modelovista.css">
</head>
<body>
<h1>🔥 ¡Batalla infernal! 🔥</h1>
<div id="fight-container">

<div class="player">
<h2>Peleador 1</h2>
<img id="fighter1Image" src="placeholder1.png" alt="Personaje 1"
class="fighter-img">
<select id="fighter1"></select>
<p id="fighter1Weapon"></p>
</div>
<div class="player">

<h2>Peleador 2</h2>
<img id="fighter2Image" src="placeholder2.png" alt="Personaje 2"
class="fighter-img">
<select id="fighter2"></select>
<p id="fighter2Weapon"></p>
</div>

</div>
<button id="fightButton">¡Pelear!</button>
<div id="result" class="hidden"></div>
<script src="/js/Superhero.js"></script>
</body>
</html>
